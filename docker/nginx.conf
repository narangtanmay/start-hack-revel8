server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The agent rewrites runs/index.html on every step; don't cache it.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        index index.html;
        autoindex on;          # browse runs/ even before the first dashboard render
        try_files $uri $uri/ =404;
    }
}
