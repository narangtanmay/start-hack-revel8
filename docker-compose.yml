# Full containerised stack for the Revel8 agent.
#
#   cp .env.example .env            # REVEL8_API_KEY, SEARCH_API_KEY, LLM_* (AMD cloud)
#   docker compose build
#   docker compose up -d web        # default: agent uses the hosted 48GB AMD LLM
#   docker compose run --rm agent osint --scenario practice
#   docker compose run --rm agent run --target julius --touches 10
#   open http://localhost:8080      # live dashboard (runs/)
#
#   # optional local LLM instead of the AMD cloud:
#   docker compose --profile local-llm up -d ollama web
#
# Services:
#   ollama  - optional local LLM (profile: local-llm); default is the hosted AMD cloud
#   agent   - the Python agent; run CLI commands with `docker compose run --rm agent <cmd>`
#   web     - nginx serving the runs/ dashboard at :8080
name: revel8

services:
  # Optional local LLM. The team's default is the hosted 48GB AMD cloud
  # (LLM_* in .env), which the agent prefers, so this service is opt-in:
  #   docker compose --profile local-llm up -d ollama
  ollama:
    image: ollama/ollama:0.5.7
    profiles: ["local-llm"]
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  agent:
    build: .
    image: revel8-agent
    # Secrets (REVEL8_API_KEY, SEARCH_API_KEY, hosted-LLM keys) come from .env.
    # Optional so the stack still boots for a smoke test before .env exists.
    env_file:
      - path: .env
        required: false
    environment:
      # Only used if you run the local-llm profile AND leave LLM_* unset;
      # with LLM_* in .env the agent uses the hosted AMD cloud and ignores this.
      LOCAL_LLM_BASE_URL: http://ollama:11434/v1
    volumes:
      - ./runs:/app/runs          # run state + rendered dashboard (shared with web)
      - ./dossiers:/app/dossiers  # cached OSINT dossiers
    entrypoint: ["uv", "run", "python", "-m", "revel8_agent.cli"]
    command: ["status"]           # default; override: docker compose run --rm agent run --target julius

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./runs:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  ollama_models:
