# Full containerised stack for the Revel8 agent.
#
#   cp .env.example .env            # fill in REVEL8_API_KEY, SEARCH_API_KEY, ...
#   docker compose build
#   docker compose up -d ollama web
#   docker compose exec ollama ollama pull "$LOCAL_LLM_MODEL"   # e.g. qwen3:32b (large)
#   docker compose run --rm agent osint --scenario practice
#   docker compose run --rm agent run --target julius --touches 10
#   open http://localhost:8080      # live dashboard (runs/)
#
# Services:
#   ollama  - the local LLM the agent talks to (LOCAL_LLM_BASE_URL -> ollama)
#   agent   - the Python agent; run CLI commands with `docker compose run --rm agent <cmd>`
#   web     - nginx serving the runs/ dashboard at :8080
name: revel8

services:
  ollama:
    image: ollama/ollama:0.5.7
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  agent:
    build: .
    image: revel8-agent
    # Secrets (REVEL8_API_KEY, SEARCH_API_KEY, hosted-LLM keys) come from .env.
    # Optional so the stack still boots for a smoke test before .env exists.
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the network the local LLM is the ollama service, not localhost.
      LOCAL_LLM_BASE_URL: http://ollama:11434/v1
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./runs:/app/runs          # run state + rendered dashboard (shared with web)
      - ./dossiers:/app/dossiers  # cached OSINT dossiers
    entrypoint: ["uv", "run", "python", "-m", "revel8_agent.cli"]
    command: ["status"]           # default; override: docker compose run --rm agent run --target julius

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./runs:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  ollama_models:
